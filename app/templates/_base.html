<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Claim Detection{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <style>
        body { font: 15px/1.5 system-ui, -apple-system, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
        h2 { font-size: 1.15rem; margin-top: 1.6rem; border-bottom: 1px solid #ddd; padding-bottom: 0.2rem; }
        nav a { margin-right: 1rem; }
        textarea, button, input { font: inherit; }
        textarea { width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #bbb; border-radius: 4px; }
        button { padding: 0.5rem 1rem; border: 0; background: #2563eb; color: white; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .result { padding: 1rem; border: 1px solid #ddd; border-radius: 4px; margin-top: 1rem; background: #f9fafb; }
        .result.claim { border-color: #16a34a; background: #ecfdf5; }
        .result.not-claim { border-color: #dc2626; background: #fef2f2; }
        .result.error { border-color: #dc2626; background: #fef2f2; color: #b91c1c; }
        .conf-bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-top: 0.4rem; }
        .conf-bar > div { height: 100%; background: #2563eb; }
        table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
        th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f3f4f6; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.pending { color: #6b7280; font-style: italic; }
        code { background: #f3f4f6; padding: 0.05rem 0.3rem; border-radius: 3px; font-size: 0.85em; }
        .pos { color: #16a34a; }
        .neg { color: #dc2626; }
        footer { margin-top: 2rem; font-size: 0.85em; color: #6b7280; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Try it</a>
        <a href="/results">Results</a>
        <a href="/healthz">Health</a>
    </nav>
    <h1>{% block heading %}Claim Detection{% endblock %}</h1>
    {% block content %}{% endblock %}
    <footer>Fine-tuned Ettin-150m on Bell-paper composite. See <code>INTERVIEW_GUIDE.md</code>.</footer>
</body>
</html>

{% if error %}
<div class="result error"><strong>Error:</strong> {{ error }}</div>
{% else %}
<div class="result {{ 'claim' if result.is_claim else 'not-claim' }}">
    <strong>{{ 'CLAIM' if result.is_claim else 'NOT A CLAIM' }}</strong>
    — confidence {{ '%.2f%%'|format(result.confidence * 100) }}
    <div class="conf-bar"><div style="width: {{ '%.1f'|format(result.confidence * 100) }}%"></div></div>
    <p style="margin: 0.5rem 0 0; color: #555; font-size: 0.9em;">{{ text }}</p>
</div>
{% endif %}

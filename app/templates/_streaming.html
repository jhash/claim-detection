<div hx-ext="sse" sse-connect="/predict/{{ job_id }}/stream" sse-swap="result"
     hx-on::sse-message="this.innerHTML = renderResult(event)">
    <div class="result">
        <strong>Working…</strong> <span sse-swap="status"></span>
        <p style="margin: 0.5rem 0 0; color: #555; font-size: 0.9em;">{{ text }}</p>
    </div>
</div>
<script>
function renderResult(ev) {
    if (ev.type !== 'result') return;
    const r = JSON.parse(ev.data);
    const cls = r.is_claim ? 'claim' : 'not-claim';
    const verdict = r.is_claim ? 'CLAIM' : 'NOT A CLAIM';
    const conf = (r.confidence * 100).toFixed(2);
    return `<div class="result ${cls}"><strong>${verdict}</strong> — confidence ${conf}%
        <div class="conf-bar"><div style="width:${conf}%"></div></div>
        <p style="margin:0.5rem 0 0;color:#555;font-size:0.9em;">{{ text|e }}</p></div>`;
}
</script>
